<!DOCTYPE html>
<html class="dark" lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>갓생 루틴 트래커 (Godsaeng Routine)</title>
  <meta name="description" content="매일의 습관과 루틴을 기록하고 스트릭과 레벨, 통계 및 캘린더로 성장하는 갓생 데일리 루틴 앱" />
  <meta property="og:title" content="갓생 루틴 트래커" />
  <meta property="og:description" content="매일의 습관과 루틴을 기록하고 스트릭과 레벨, 통계 및 캘린더로 성장하는 갓생 데일리 루틴 앱" />
  <meta property="og:type" content="website" />

  <!-- Google Fonts: Manrope & Hanken Grotesk -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <!-- Google Material Symbols Outlined -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

  <!-- Tailwind CSS Engine -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            surface: "#0f172a",
            "surface-dim": "#0b1326",
            "surface-container": "#1e293b",
            "surface-container-low": "#172033",
            "surface-container-high": "#334155",
            "surface-container-highest": "#475569",
            "on-surface": "#f1f5f9",
            "on-surface-variant": "#94a3b8",
            primary: "#10b981",
            "on-primary": "#022c22",
            "primary-container": "#047857",
            "on-primary-container": "#d1fae5",
            secondary: "#10b981",
            "secondary-container": "#065f46",
            "on-secondary-container": "#a7f3d0",
            error: "#f87171"
          },
          fontFamily: {
            sans: ["Hanken Grotesk", "sans-serif"],
            manrope: ["Manrope", "sans-serif"]
          }
        }
      }
    };
  </script>

  <style>
    body {
      font-family: 'Hanken Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
      min-height: 100dvh;
    }
    .font-headline, .font-headline-sm, .font-headline-md, .font-display-lg {
      font-family: 'Manrope', sans-serif;
    }
    ::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom, 16px);
    }
    .pt-safe {
      padding-top: env(safe-area-inset-top, 0px);
    }
    /* Light mode custom overrides */
    html:not(.dark) body {
      background-color: #f8fafc;
      color: #0f172a;
    }
    html:not(.dark) header,
    html:not(.dark) nav {
      background-color: rgba(255, 255, 255, 0.9);
      border-color: #e2e8f0;
    }
    html:not(.dark) .bg-slate-800,
    html:not(.dark) .bg-slate-800\/90,
    html:not(.dark) .bg-slate-850,
    html:not(.dark) .bg-slate-850\/80 {
      background-color: #ffffff !important;
      border-color: #e2e8f0 !important;
    }
    html:not(.dark) .bg-slate-900,
    html:not(.dark) .bg-slate-900\/60,
    html:not(.dark) .bg-slate-900\/80 {
      background-color: #f1f5f9 !important;
      border-color: #e2e8f0 !important;
      color: #0f172a !important;
    }
    html:not(.dark) .text-slate-100,
    html:not(.dark) .text-slate-200 {
      color: #0f172a !important;
    }
    html:not(.dark) .text-slate-300,
    html:not(.dark) .text-slate-400 {
      color: #475569 !important;
    }
    html:not(.dark) .border-slate-700,
    html:not(.dark) .border-slate-700\/60,
    html:not(.dark) .border-slate-700\/70,
    html:not(.dark) .border-slate-700\/80,
    html:not(.dark) .border-slate-800 {
      border-color: #e2e8f0 !important;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen relative flex flex-col antialiased selection:bg-emerald-500/20 selection:text-emerald-400">

  <!-- Ambient emerald background radial gradient -->
  <div class="pointer-events-none fixed inset-0 z-0 bg-[radial-gradient(ellipse_80%_50%_at_50%_-15%,rgba(16,185,129,0.18),transparent_70%)]"></div>

  <!-- Interactive Toast Notification Feedback -->
  <div id="toast" class="fixed top-20 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 transition-all duration-300 transform scale-90 flex items-center gap-2 bg-slate-800 text-slate-100 px-4 py-2.5 rounded-full shadow-2xl border border-slate-700 max-w-sm text-center">
    <span class="material-symbols-outlined text-emerald-400 text-[20px]">check_circle</span>
    <span id="toast-text" class="text-[13px] font-semibold">알림 메시지</span>
  </div>

  <!-- 100% 달성 축하 오버레이 (하루 1회) -->
  <div id="celebration-overlay" class="hidden fixed inset-0 z-50 flex flex-col items-center justify-center bg-slate-950/80 backdrop-blur-md transition-all select-none">
    <div class="flex flex-col items-center text-center p-6 rounded-3xl bg-slate-850 border border-emerald-500/40 shadow-2xl animate-bounce">
      <div class="w-20 h-20 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-4xl mb-3 shadow-[0_0_24px_rgba(16,185,129,0.5)]">
        🏆
      </div>
      <h2 class="font-headline text-2xl font-extrabold text-slate-100">오늘의 루틴 100% 완수!</h2>
      <p class="text-[14px] text-emerald-400 font-semibold mt-1">+30 보너스 XP 획득!</p>
      <p class="text-[12px] text-slate-300 mt-2">오늘도 멋지게 갓생을 실천하셨습니다. 최고예요! ✨</p>
    </div>
  </div>

  <!-- 상단 헤더 (진행중 루틴, 스트릭 배지, 레벨 & XP 바, 알림) -->
  <header id="app-header" class="fixed top-0 w-full z-40 pt-safe bg-slate-900/80 backdrop-blur-xl border-b border-slate-800 shadow-[0_4px_20px_-2px_rgba(0,0,0,0.5)]"></header>

  <!-- 메인 컨텐츠 영역 -->
  <main class="flex-1 w-full max-w-lg mx-auto px-4 pt-20 pb-28 relative z-10">
    <!-- 초기 로딩 스켈레톤 -->
    <div id="loading-skeleton" class="flex flex-col gap-4 animate-pulse">
      <div class="h-20 rounded-2xl bg-slate-800/80"></div>
      <div class="h-28 rounded-2xl bg-slate-800/80"></div>
      <div class="h-10 rounded-xl bg-slate-800/80"></div>
      <div class="h-16 rounded-2xl bg-slate-800/80"></div>
      <div class="h-16 rounded-2xl bg-slate-800/80"></div>
      <div class="h-16 rounded-2xl bg-slate-800/80"></div>
    </div>

    <!-- 실제 화면 컨테이너 -->
    <div id="main-content" class="hidden flex flex-col w-full">
      <!-- 1. 오늘 탭 (Today) -->
      <section id="view-today"></section>

      <!-- 2. 달력 탭 (Calendar) -->
      <section id="view-calendar" class="hidden"></section>

      <!-- 3. 루틴탐색 탭 (Explore) -->
      <section id="view-explore" class="hidden"></section>

      <!-- 4. 통계 탭 (Analytics / Stats) -->
      <section id="view-stats" class="hidden"></section>

      <!-- 5. 설정 탭 (Settings) -->
      <section id="view-settings" class="hidden"></section>
    </div>
  </main>

  <!-- 루틴 추가 / 수정 모달 (#routine-modal) -->
  <div id="routine-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-sm">
    <div class="w-full max-w-md bg-slate-850 rounded-2xl border border-slate-700/80 p-5 shadow-2xl flex flex-col gap-4">
      <div class="flex items-center justify-between pb-3 border-b border-slate-700/60">
        <h3 id="modal-title" class="font-headline text-lg font-bold text-slate-100">새 루틴 추가</h3>
        <button id="modal-btn-close" type="button" class="w-7 h-7 rounded-lg text-slate-400 hover:text-slate-100 hover:bg-slate-700 flex items-center justify-center">
          <span class="material-symbols-outlined text-[20px]">close</span>
        </button>
      </div>

      <div class="flex flex-col gap-3.5">
        <!-- 루틴 제목 & 이모지 -->
        <div class="flex flex-col gap-1.5">
          <label class="text-[12px] font-semibold text-slate-300">루틴 이름 & 아이콘 <span class="text-emerald-400">*</span></label>
          <div class="flex items-center gap-2">
            <input id="modal-input-emoji" type="text" maxlength="2" placeholder="✨" value="✨" class="w-12 text-center py-2 bg-slate-800 rounded-xl text-lg border border-slate-700 text-slate-100 focus:outline-none focus:border-emerald-400" />
            <input id="modal-input-title" type="text" maxlength="30" placeholder="예: 기상 직후 미온수 한 잔 (1~30자)" class="flex-1 px-3 py-2 bg-slate-800 rounded-xl text-[13px] border border-slate-700 text-slate-100 placeholder:text-slate-500 focus:outline-none focus:border-emerald-400" />
          </div>
        </div>

        <!-- 카테고리 -->
        <div class="flex flex-col gap-1.5">
          <label class="text-[12px] font-semibold text-slate-300">카테고리 <span class="text-emerald-400">*</span></label>
          <select id="modal-select-category" class="w-full px-3 py-2 bg-slate-800 rounded-xl text-[13px] border border-slate-700 text-slate-100 focus:outline-none focus:border-emerald-400">
            <option value="workout">💪 운동 / 건강</option>
            <option value="study">📚 성장 / 학습</option>
            <option value="mindset">🧘 멘탈케어</option>
            <option value="work">💼 업무 / 생산성</option>
          </select>
        </div>

        <!-- 목표 시간 (선택) -->
        <div class="flex flex-col gap-1.5">
          <label class="text-[12px] font-semibold text-slate-300">목표 시간 (선택)</label>
          <input id="modal-input-time" type="time" class="w-full px-3 py-2 bg-slate-800 rounded-xl text-[13px] border border-slate-700 text-slate-100 focus:outline-none focus:border-emerald-400" />
        </div>

        <!-- 반복 요일 선택 (최소 1개 이상) -->
        <div class="flex flex-col gap-1.5">
          <label class="text-[12px] font-semibold text-slate-300">반복 요일 <span class="text-emerald-400">*</span></label>
          <div class="grid grid-cols-7 gap-1.5 text-center">
            <label class="cursor-pointer">
              <input type="checkbox" name="modal-repeat-days" value="0" class="peer hidden" checked />
              <div class="py-2 rounded-xl bg-slate-800 peer-checked:bg-emerald-500 peer-checked:text-slate-950 text-slate-400 font-bold text-[12px] transition-all border border-slate-700 peer-checked:border-emerald-400">일</div>
            </label>
            <label class="cursor-pointer">
              <input type="checkbox" name="modal-repeat-days" value="1" class="peer hidden" checked />
              <div class="py-2 rounded-xl bg-slate-800 peer-checked:bg-emerald-500 peer-checked:text-slate-950 text-slate-400 font-bold text-[12px] transition-all border border-slate-700 peer-checked:border-emerald-400">월</div>
            </label>
            <label class="cursor-pointer">
              <input type="checkbox" name="modal-repeat-days" value="2" class="peer hidden" checked />
              <div class="py-2 rounded-xl bg-slate-800 peer-checked:bg-emerald-500 peer-checked:text-slate-950 text-slate-400 font-bold text-[12px] transition-all border border-slate-700 peer-checked:border-emerald-400">화</div>
            </label>
            <label class="cursor-pointer">
              <input type="checkbox" name="modal-repeat-days" value="3" class="peer hidden" checked />
              <div class="py-2 rounded-xl bg-slate-800 peer-checked:bg-emerald-500 peer-checked:text-slate-950 text-slate-400 font-bold text-[12px] transition-all border border-slate-700 peer-checked:border-emerald-400">수</div>
            </label>
            <label class="cursor-pointer">
              <input type="checkbox" name="modal-repeat-days" value="4" class="peer hidden" checked />
              <div class="py-2 rounded-xl bg-slate-800 peer-checked:bg-emerald-500 peer-checked:text-slate-950 text-slate-400 font-bold text-[12px] transition-all border border-slate-700 peer-checked:border-emerald-400">목</div>
            </label>
            <label class="cursor-pointer">
              <input type="checkbox" name="modal-repeat-days" value="5" class="peer hidden" checked />
              <div class="py-2 rounded-xl bg-slate-800 peer-checked:bg-emerald-500 peer-checked:text-slate-950 text-slate-400 font-bold text-[12px] transition-all border border-slate-700 peer-checked:border-emerald-400">금</div>
            </label>
            <label class="cursor-pointer">
              <input type="checkbox" name="modal-repeat-days" value="6" class="peer hidden" checked />
              <div class="py-2 rounded-xl bg-slate-800 peer-checked:bg-emerald-500 peer-checked:text-slate-950 text-slate-400 font-bold text-[12px] transition-all border border-slate-700 peer-checked:border-emerald-400">토</div>
            </label>
          </div>
        </div>
      </div>

      <!-- 하단 버튼 -->
      <div class="flex items-center justify-end gap-2 pt-3 border-t border-slate-700/60 mt-1">
        <button id="modal-btn-cancel" type="button" class="px-4 py-2 rounded-xl bg-slate-700 hover:bg-slate-600 text-slate-200 text-[13px] font-semibold transition-all">취소</button>
        <button id="modal-btn-save" type="button" class="px-5 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-[13px] font-bold shadow-md transition-all active:scale-95">저장하기</button>
      </div>
    </div>
  </div>

  <!-- 하단 탭 네비게이션 (오늘, 달력, 루틴탐색, 통계, 설정) -->
  <nav class="fixed bottom-0 w-full z-40 pb-safe bg-slate-900/85 backdrop-blur-xl border-t border-slate-800 shadow-[0_-6px_28px_rgba(0,0,0,0.6)]">
    <div class="h-16 px-2 flex items-center justify-around max-w-lg mx-auto w-full">
      <!-- 1. 오늘 -->
      <a data-path="today" href="#" class="min-w-[44px] min-h-[44px] flex flex-col items-center justify-center gap-1 text-emerald-400 transition-all">
        <div class="w-9 h-7 rounded-2xl flex items-center justify-center transition-all bg-emerald-500/15 text-emerald-400 shadow-[0_0_14px_rgba(16,185,129,0.35)] ring-1 ring-emerald-500/30">
          <span class="material-symbols-outlined text-[20px]">check_circle</span>
        </div>
        <span class="text-[11px] font-semibold tracking-tight">오늘</span>
      </a>

      <!-- 2. 달력 -->
      <a data-path="calendar" href="#" class="min-w-[44px] min-h-[44px] flex flex-col items-center justify-center gap-1 text-slate-400 hover:text-slate-200 transition-all">
        <div class="w-9 h-7 rounded-2xl flex items-center justify-center transition-all">
          <span class="material-symbols-outlined text-[20px]">calendar_month</span>
        </div>
        <span class="text-[11px] font-semibold tracking-tight">달력</span>
      </a>

      <!-- 3. 루틴탐색 -->
      <a data-path="explore-routines" href="#" class="min-w-[44px] min-h-[44px] flex flex-col items-center justify-center gap-1 text-slate-400 hover:text-slate-200 transition-all">
        <div class="w-9 h-7 rounded-2xl flex items-center justify-center transition-all">
          <span class="material-symbols-outlined text-[20px]">dashboard_customize</span>
        </div>
        <span class="text-[11px] font-semibold tracking-tight">루틴탐색</span>
      </a>

      <!-- 4. 통계 -->
      <a data-path="analytics" href="#" class="min-w-[44px] min-h-[44px] flex flex-col items-center justify-center gap-1 text-slate-400 hover:text-slate-200 transition-all">
        <div class="w-9 h-7 rounded-2xl flex items-center justify-center transition-all">
          <span class="material-symbols-outlined text-[20px]">trending_up</span>
        </div>
        <span class="text-[11px] font-semibold tracking-tight">통계</span>
      </a>

      <!-- 5. 설정 -->
      <a data-path="settings" href="#" class="min-w-[44px] min-h-[44px] flex flex-col items-center justify-center gap-1 text-slate-400 hover:text-slate-200 transition-all">
        <div class="w-9 h-7 rounded-2xl flex items-center justify-center transition-all">
          <span class="material-symbols-outlined text-[20px]">tune</span>
        </div>
        <span class="text-[11px] font-semibold tracking-tight">설정</span>
      </a>
    </div>
  </nav>

  <!-- 애플리케이션 번들 스크립트 연결 -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
